[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ocode"
dynamic = ["version"]
description = "An opencode-style AI coding assistant for your terminal, powered by local Ollama models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["textual>=1.0"]
keywords = ["ollama", "ai", "coding-assistant", "terminal", "tui", "llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.optional-dependencies]
vision  = ["pillow", "av"]
monitor = ["psutil"]
voice   = ["sounddevice", "numpy", "faster-whisper"]
discord = ["discord.py"]
all     = ["pillow", "av", "psutil", "sounddevice", "numpy", "faster-whisper", "discord.py"]

[project.scripts]
ocode = "ocode:cli"

[tool.setuptools]
py-modules = ["ocode"]

[tool.setuptools.dynamic]
version = {attr = "ocode.VERSION"}
